# Donne le port USB du module EG800Q-EU au groupe dialer à chaque branchement,
# pour que sms_claude.py (port "usb", via pyusb) tourne sans être root.
# À copier dans /usr/local/etc/devd/, puis : service devd restart
# $cdev est le nom du périphérique, ex. ugen0.3

notify 100 {
	match "system"		"USB";
	match "subsystem"	"DEVICE";
	match "type"		"ATTACH";
	match "vendor"		"0x2c7c";
	match "product"		"0x6007";
	action "chgrp dialer /dev/$cdev && chmod 660 /dev/$cdev";
};
